<!doctype html><meta charset="utf-8"><title>Arcade · verifica sprite locali</title><style>body{background:#091b35;color:#eff;font:18px monospace}canvas{background:#209347;margin:10px;border:3px solid #ffdc35}#status{padding:12px}</style><h1>Verifica palette con apertura file locale</h1><p id="status">Caricamento…</p><canvas id="human" width="320" height="250"></canvas><canvas id="animal" width="320" height="250"></canvas>
<script src="../assets/offline-sprites.js"></script><script src="../assets/animations.js"></script><script src="../assets/jurassic-frames.js"></script><script src="../engine/core.js"></script><script src="../engine/final-showdown.js"></script><script>
(async()=>{try{const kit={shirtPrimary:'#ffffff',shirtSecondary:'#d52939',shorts:'#132d73',socks:'#fff',pattern:'horizontal_band',clashResolved:true};const r=new S9ArcadeEngine.Renderer(document.getElementById('human'));await new Promise((resolve,reject)=>{if(r.atlas.complete&&r.atlas.naturalWidth)return resolve();r.atlas.onload=resolve;r.atlas.onerror=reject});r.ctx.translate(160,220);r.sprite({role:'ST',action:'idle',face:{x:1,y:0},team:{kit}}, {elapsed:0,ball:{}},{scale:2});r.ctx.getImageData(0,0,320,250);const a=new S9ArcadeEngine.Renderer(document.getElementById('animal'));a.creatureAtlas=new Image();a.creatureAtlas.src=S9ArcadeSpriteSource('creatures','../assets/jurassic-players.png');await new Promise((resolve,reject)=>{if(a.creatureAtlas.complete&&a.creatureAtlas.naturalWidth)return resolve();a.creatureAtlas.onload=resolve;a.creatureAtlas.onerror=reject});a.ctx.translate(160,220);a.sprite({creature:'trex',role:'ST',action:'idle',vx:0,vy:0,face:{x:1,y:0},number:1,team:{id:1,kit}}, {elapsed:0,ball:{}},{scale:2});a.ctx.getImageData(0,0,320,250);document.getElementById('status').textContent='PASS · palette giocatori e Jurassic leggibili senza canvas tainted · '+location.protocol}catch(e){document.getElementById('status').textContent='FAIL · '+e.message}})();
